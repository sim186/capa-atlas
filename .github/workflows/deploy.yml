name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Static export served from sim186.github.io/capa-atlas/
          GH_PAGES: "true"
          # The PostHog project token is a public client-side key by design.
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: phc_BAXTaWMrWoyREmDcnWv6WbeLiHgaod3oZtcxbvwGtfnb
          NEXT_PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com
          # Contact address for the credits panel, split in three so no single
          # value is an address. Repo secrets: Settings > Secrets and variables >
          # Actions > NEXT_PUBLIC_CONTACT_USER / _DOMAIN / _TLD. Left unset, the
          # panel drops the contact button instead of showing a dead one.
          NEXT_PUBLIC_CONTACT_USER: ${{ secrets.NEXT_PUBLIC_CONTACT_USER }}
          NEXT_PUBLIC_CONTACT_DOMAIN: ${{ secrets.NEXT_PUBLIC_CONTACT_DOMAIN }}
          NEXT_PUBLIC_CONTACT_TLD: ${{ secrets.NEXT_PUBLIC_CONTACT_TLD }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
